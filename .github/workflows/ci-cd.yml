name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # Test Backend
  test-backend:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd backend
        npm ci
    
    - name: Run migrations
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        JWT_SECRET: test_jwt_secret_key_for_ci
      run: |
        cd backend
        npm run migrate
    
    - name: Lint code
      run: |
        cd backend
        npm run lint || echo "No lint script found"

  # Test Frontend
  test-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    
    - name: Install dependencies
      run: |
        cd frontend
        npm ci
    
    - name: Build frontend
      env:
        VITE_API_URL: https://api.example.com
      run: |
        cd frontend
        npm run build
    
    - name: Lint code
      run: |
        cd frontend
        npm run lint || echo "No lint script found"

  # Deploy to Render (solo en main)
  deploy-render:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Trigger Render Deployment
      run: |
        echo "Deploy triggered automatically by Render"
        # Render auto-deploys cuando detecta cambios en main

  # Notificación de éxito
  notify-success:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: success()
    
    steps:
    - name: Success notification
      run: echo "✅ All tests passed successfully!"
